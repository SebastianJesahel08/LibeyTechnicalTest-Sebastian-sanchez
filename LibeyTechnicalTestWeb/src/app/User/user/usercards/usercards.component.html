<div class="row mt-3" style="margin: 5rem 10rem 0 10rem; padding-top: 2rem; background-color:#edf2f6;border-radius: 10px;">
  <div class="col-12">
    <div style="display:flex; gap:10px; align-items:center; justify-content: space-between; margin-bottom: 15px;">
      <h3 style="margin:0;">Clientes</h3>
      <button class="btn btn-primary" (click)="goNew()">Nuevo</button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom: 15px;">
      <input class="form-control" [(ngModel)]="search" placeholder="Buscar por documento, nombre o email" />
      <button class="btn btn-success" (click)="onSearch()">Buscar</button>
    </div>

    <div *ngIf="loading">Cargando...</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Activo</th>
            <th style="width: 180px;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <td>{{u.documentNumber}}</td>
            <td>{{u.name}} {{u.fathersLastName}} {{u.mothersLastName}}</td>
            <td>{{u.email}}</td>
            <td>{{u.phone}}</td>
            <td>{{u.active}}</td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="goEdit(u.documentNumber)">Editar</button>
              <button class="btn btn-danger" (click)="onDelete(u.documentNumber)">Eliminar</button>
            </td>
          </tr>

          <tr *ngIf="users.length === 0">
            <td colspan="6" style="text-align:center;">No hay resultados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
